title: Watanyoo Putta
description: Watanyoo Putta (วทัญญู พุทธา), Khon Kaen, Thailand. Tropical disease research, One Health and biosensors.
url: "https://watanyooputta.com"
baseurl: ""
lang: en
timezone: Asia/Bangkok

plugins:
  - jekyll-sitemap
  - jekyll-feed

author: Watanyoo Putta
feed:
  collections:
    - news

collections:
  news:
    output: true
    permalink: /news/:title/

defaults:
  - scope:
      path: ""
      type: "news"
    values:
      layout: news
      image: /assets/og/news.jpg

# Files Jekyll should NOT publish as pages
exclude:
  - README.md
  - CHANGELOG.md
  - SECURITY.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - CITATION.cff
  - Gemfile
  - Gemfile.lock

# Dot-folders are hidden by Jekyll unless listed here
include:
  - .well-known
