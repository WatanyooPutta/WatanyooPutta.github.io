title: Watanyoo Putta
description: Watanyoo Putta (วทัญญู พุทธา), Khon Kaen, Thailand. Tropical disease research, One Health and biosensors.
url: "https://watanyooputta.com"
baseurl: ""
lang: en
timezone: Asia/Bangkok

plugins:
  - jekyll-sitemap

collections:
  news:
    output: true
    permalink: /news/:title/

defaults:
  - scope:
      path: ""
      type: "news"
    values:
      layout: news

exclude:
  - README.md
  - CHANGELOG.md
  - SECURITY.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - CITATION.cff
  - Gemfile
  - Gemfile.lock

include:
  - .well-known
