<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>System Update | Watanyoo Putta</title>

    <style>
        body {
            margin: 0;

            margin-bottom: 32px;
        }
        .links {
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        .links a {
            text-decoration: none;
            color: #0066cc;
            font-weight: 500;
            padding: 8px 16px;
            border: 1px solid #0066cc;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .links a:hover {
