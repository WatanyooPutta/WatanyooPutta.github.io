<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Watanyoo Putta</title>
  <meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/images/IMG_9921-400.webp" type="image/webp">

  <style>
    :root{color-scheme:dark light;--bg:#07080a;--panel:#0d0f13;--panel2:#13161c;--text:#ececf1;--muted:#98a0ae;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.18);--accent:#3ee0b5;--ink:#04110d;--glow:rgba(62,224,181,.13);--r:18px;--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
    @media(prefers-color-scheme:light){:root{--bg:#fafafa;--panel:#fff;--panel2:#f4f5f7;--text:#0b0d12;--muted:#596070;--line:rgba(11,13,18,.09);--line2:rgba(11,13,18,.2);--accent:#0b7a62;--ink:#fff;--glow:rgba(11,122,98,.1)}}
    *{box-sizing:border-box;margin:0}
    html{scroll-behavior:smooth}
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text);line-height:1.65;padding:0 16px 40px;-webkit-font-smoothing:antialiased}
    body::before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 0,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 80% 55% at 50% 0,#000 10%,transparent 75%)}
    body::after{content:"";position:fixed;left:50%;top:-220px;width:900px;height:520px;transform:translateX(-50%);z-index:-1;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
    .wrap{max-width:1080px;margin:0 auto}
    a{color:var(--accent)}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--ink);font:inherit;font-weight:600;font-size:.92rem;text-decoration:none;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
    .btn.alt{background:transparent;color:var(--text);border-color:var(--line2)}
    .btn.alt:hover{border-color:var(--accent)}.btn:active{transform:translateY(1px)}.btn:not(.alt):hover{filter:brightness(1.08)}
    .muted{color:var(--muted);font-size:.95rem}
    .nf{min-height:80vh;display:grid;place-content:center;text-align:center;gap:14px}
    .nf .big{font:700 clamp(5rem,22vw,9rem)/1 var(--mono);letter-spacing:-.06em;background:linear-gradient(180deg,var(--text),var(--muted));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    @media(prefers-reduced-motion:reduce){*,::before{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="wrap nf">
    <div class="big">404</div>
    <h1 style="font-size:1.6rem;-webkit-text-fill-color:var(--text);background:none">Page not found</h1>
    <p class="muted">The page may have moved or never existed. หน้านี้อาจถูกย้ายหรือไม่มีอยู่</p>
    <div class="btns" style="justify-content:center">
      <a class="btn" href="/">Home</a>
      <a class="btn alt" href="https://medium.com/@watanyoo.putta" target="_blank" rel="noopener noreferrer">Medium</a>
    </div>
  </div>
</body>
</html>
