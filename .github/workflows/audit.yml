name: Automated Quality & Link Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  link-checker:
    name: Lychee Broken Link Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress 
            --accept "200..=204, 429"
            --exclude "medium\.com"
            --exclude "linkedin\.com"
            --exclude "scholar\.google\.com"
            "./**/*.html"
            "./**/*.md"
          fail: false

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Static Server
        run: npm install -g serve

      - name: Start Local Server
        run: serve ./ -p 8080 &

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: 'http://localhost:8080/index.html'
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true
