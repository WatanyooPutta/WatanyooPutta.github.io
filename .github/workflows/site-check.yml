- name: Validate JSON and XML files
        run: |

        
          python3 - <<'PY'
          import json, re, xml.dom.minidom as m
          
          for f in ["profile.json", "site.webmanifest"]:
              json.load(open(f, encoding="utf-8"))
              print("OK", f)
              
          m.parse("sitemap.xml")
          print("OK sitemap.xml")
          
          for f in ["index.html", "th.html"]:
              s = open(f, encoding="utf-8").read()
              match = re.search(r'ld\+json[^>]*>(.*?)</script>', s, re.S)
              if match:
                  json.loads(match.group(1))
                  print("OK JSON-LD in", f)
              else:
                  print("No JSON-LD found in " + f + " (Skipping)")
          PY
